# Minimal environment for building the ERA5 digest (make_era5_digest.py).
#
# NOT the POD's runtime environment -- that is
# env_finite_amplitude_wave_diag.yml, which additionally carries cartopy,
# jupyter, nbconvert and intake-esm for the notebook driver and the plots.
#
# The digest job runs on a compute node, draws nothing, and locates its own
# files, so it needs none of those. Leaving them out avoids pulling in
# geos/proj/shapely and the notebook stack, which is most of what makes the
# full environment slow to solve.
#
#   conda env create -f env_era5_digest.yml --solver=libmamba
#   conda activate _MDTF_era5_digest
#
# Library versions are deliberately left open -- the digest is a one-off offline
# job, not a reproducible POD run, and the tight pins are what make the POD's
# own environment slow to solve.
#
# Python itself IS pinned. Left open it resolves to whatever is newest, which
# at the time of writing meant 3.14; falwa builds F2PY extension modules from
# source against numpy, and the newest interpreter is the worst place to
# discover that something in that toolchain has moved. 3.12 is what this was
# tested against.
#
# NOTE ON DISK: building falwa from source needs room in both TMPDIR and the
# pip cache, and a full home directory shows up as an obscure failure late in
# the build:
#     [Errno 28] No space left on device: '~/.cache/pip/wheels/...'
# If home is tight, point both elsewhere before installing:
#     export TMPDIR=/nas/<somewhere>/tmp PIP_CACHE_DIR=/nas/<somewhere>/pipcache
name: _MDTF_era5_digest
channels:
- conda-forge
dependencies:
- python=3.12
- numpy
- scipy
- netCDF4
- xarray
- dask
- bottleneck
- pyyaml
- gridfill
# falwa is source-only: its F2PY extensions are built by Meson for the host, so
# a Fortran compiler is required at install time.
- fortran-compiler
- pip
- pip:
   - falwa==2.3.3
