name: _MDTF_finite_amplitude_wave_diag
channels:
- conda-forge
dependencies:
- python=3.10
- numpy=1.22.3
- scipy=1.9
- netCDF4=1.5.8
- xarray=2023.2.0
- cartopy=0.21.0
- matplotlib=3.5.3
- pytest==7.4.0
- pip=22.0.4
- dask
- gridfill
- bottleneck
# Reading the framework hand-off: case_info.yml (pyyaml) and the postprocessed
# data catalog it names (intake-esm). See doc/sphinx/ref_envvars.rst.
- pyyaml
- intake-esm
# The driver is a notebook, which the framework runs with
# `jupyter nbconvert --to html --execute` (src/environment_manager.py:409).
# This POD has its own environment, so it does not inherit these from
# env_python3_base; without them the run fails at `/usr/bin/env jupyter`.
- jupyter
- nbconvert
# falwa ships as a source distribution only: its F2PY extension modules are
# built by Meson against the host machine, so there are no wheels to fall back
# on. pip supplies the Python build backend (meson-python, ninja) itself via
# PEP 517, but it cannot supply a Fortran compiler -- that has to come from
# conda, hence fortran-compiler here. Without it the pip step below fails at
# build time with a missing-compiler error.
- fortran-compiler
- pip
- pip:
   # 2.3.3 is the current release. The driver passes
   # data_on_evenly_spaced_pseudoheight_grid to QGFieldNH18, which is new in
   # falwa 1.3, so the previous 1.2.1 pin would raise TypeError.
   - falwa==2.3.3
